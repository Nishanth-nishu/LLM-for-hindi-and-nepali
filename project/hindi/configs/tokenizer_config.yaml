# tokenizer_config.yaml ??? Hindi
# ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Tokenizer training and vocabulary sweep configuration.
#
# IMPORTANT: `final_vocab_size` must be set EXPLICITLY after reviewing the
# sweep results table in tokenizer/analysis/sweep_results.csv.
# Do not let train_tokenizer.py auto-select this silently ??? the chosen value
# must be recorded here with a rationale before the tokenizer is considered final.

lang: hindi
model_type: unigram              # unigram | bpe (set here, not as CLI flag)

# ?????? Training corpus ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
train_split: hindi/data/splits/train.jsonl
text_key: text

# ?????? Vocabulary sweep ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
sweep:
  vocab_sizes: [16000, 24000, 32000]
  eval_split: hindi/data/splits/val.jsonl
  metrics:
    - fertility               # avg tokens per whitespace-word (lower is better)
    - avg_chars_per_token
    - unk_rate
    - compression_ratio       # raw bytes / token count

# ?????? Final vocabulary selection ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Set this AFTER running the sweep and reviewing sweep_results.csv.
final_vocab_size: null          # FILL IN after sweep ??? e.g. 32000
final_vocab_size_rationale: "NOT YET SET ??? review sweep_results.csv and fill in"

# ?????? SentencePiece training parameters ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
sentencepiece:
  character_coverage: 0.9999   # 0.9999 appropriate for Devanagari script
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3
  normalization_rule_name: nmt_nfkc
  remove_extra_whitespaces: true
  input_sentence_size: 5_000_000
  shuffle_input_sentence: true

# ?????? Output paths ??????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
output:
  vocab_dir: hindi/tokenizer/vocab/
  analysis_dir: hindi/tokenizer/analysis/
  model_name: hindi_tokenizer   # output files: hindi_tokenizer.model, .vocab
