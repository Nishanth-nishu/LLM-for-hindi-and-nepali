# Thresholds for the Hindi cleaning pipeline.
# Values set by distribution inspection on Hindi Wikipedia (163K docs sample).
# Conservative where uncertain ??? all values documented with rationale.
#
# Distribution inspection methodology:
#   - 2000???5000 doc random sample from hi_wiki_boilerplate.jsonl
#   - Devanagari ratio: p5=0.674, p10=0.719, p25=0.760, p50=0.783
#   - char_count: p5~500 chars, p10~800 chars
#   - mean_line_length: p5~20 chars (Wikipedia section headers)
#   - punct_symbol_ratio (Unicode P+S only, NOT the broken alpha-subtraction):
#       p95 ~0.04, so 0.15 is very generous

# ?????? Language Identification ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
language_id:
  confidence_threshold:
    value: 0.65
    rationale: "Distribution inspection on Wikipedia: fastText hi confidence
      concentrated near 1.0 for clean Hindi. 0.65 drops obvious English/mixed
      pages while keeping borderline Hinglish. Conservative choice."
    set_by: distribution_inspection
    conservative_fallback: 0.65

  accepted_codes:
    - hi

# ?????? Normalization / Repair ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
normalization:
  min_chars_after_norm:
    value: 50
    rationale: "Documents below 50 chars after normalization are stubs.
      Wikipedia occasionally has redirect stubs. Set at p0.1 of length dist."
    set_by: distribution_inspection
    conservative_fallback: 50

# ?????? Quality Filters ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
quality_filters:
  min_char_count:
    value: 100
    rationale: "p5 of Hindi Wikipedia is ~500 chars. Setting 100 only removes
      pure stubs/redirects. Very conservative to preserve maximum data."
    set_by: distribution_inspection
    conservative_fallback: 150

  min_devanagari_ratio:
    value: 0.30
    rationale: "Hindi Wikipedia p5=0.674. Set at 0.30 to allow mixed
      Hindi+English text (citations, technical terms, infoboxes). Anything
      below 0.30 is likely an English or transliterated page."
    set_by: distribution_inspection
    conservative_fallback: 0.30

  max_whitespace_ratio:
    value: 0.35
    rationale: "Hindi Wikipedia median ~0.15. 0.35 is very generous, only
      catches tab-separated tables or whitespace-padding artifacts."
    set_by: distribution_inspection
    conservative_fallback: 0.35

  max_punct_symbol_ratio:
    value: 0.15
    rationale: "Using Unicode P+S category ratio (NOT alpha-subtraction).
      Hindi Wikipedia has dandas (???), commas, brackets giving ~3-5%.
      0.15 only drops pure-punctuation garbage/tables."
    set_by: distribution_inspection
    conservative_fallback: 0.15

  max_digit_ratio:
    value: 0.20
    rationale: "Wikipedia articles often have dates, statistics (10-15%).
      0.20 allows most data tables while catching digit-only spam."
    set_by: distribution_inspection
    conservative_fallback: 0.20

  max_url_ratio:
    value: 0.10
    rationale: "Wikipedia has citation URLs but text-to-URL ratio is low.
      0.10 (10% of tokens) drops reference-list-only stubs."
    set_by: distribution_inspection
    conservative_fallback: 0.10

  max_repeated_line_ratio:
    value: 0.30
    rationale: "Wikipedia navboxes and category listings can have repeated
      short lines. 0.30 allows some repetition while catching scraped menus."
    set_by: distribution_inspection
    conservative_fallback: 0.30

  max_repeated_ngram_ratio:
    value: 0.25
    rationale: "Wikipedia articles with tables/infoboxes can have repeated
      5-grams. 0.25 is generous. Catches only extreme repetition."
    set_by: distribution_inspection
    conservative_fallback: 0.25

  min_mean_line_length:
    value: 10.0
    rationale: "Wikipedia section headings are short (~15-20 chars).
      Set to 10 to only drop nav-menu/bullet-point-only dumps."
    set_by: distribution_inspection
    conservative_fallback: 10.0

  min_paragraph_count:
    value: 1
    rationale: "Even single-paragraph Wikipedia stubs are valid training docs.
      Only drop completely empty documents."
    set_by: distribution_inspection
    conservative_fallback: 1

# ?????? Exact Deduplication ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
dedup_exact:
  hash_normalisation: "whitespace_collapse_only"

# ?????? Paragraph Deduplication ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
dedup_paragraph:
  min_paragraph_frequency:
    value: 10
    rationale: "A paragraph appearing in 10+ different docs is likely boilerplate
      (nav text, copyright notices). Conservative to preserve unique content."
    set_by: distribution_inspection
    conservative_fallback: 10

  min_paragraph_chars:
    value: 100
    rationale: "Short paragraphs (section headings) are excluded from para-dedup
      to avoid accidentally treating legitimate headings as boilerplate."
    set_by: distribution_inspection
    conservative_fallback: 100

# ?????? Near Deduplication (MinHash + LSH) ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
dedup_near:
  jaccard_threshold:
    value: 0.80
    rationale: "80% n-gram overlap indicates near-identical documents.
      Standard threshold for monolingual near-dedup pipelines (CC-Net, MassiveText)."
    set_by: distribution_inspection
    conservative_fallback: 0.80

  n_gram_size: 5
  num_perm: 128

# ?????? Semantic / Safety Filter ??????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
semantic_safety:
  enabled: true
  categories:
    - name: explicit_sexual_content
      enabled: true
      action: drop
    - name: extreme_violence
      enabled: true
      action: drop
    - name: hate_speech
      enabled: true
      action: drop
    - name: spam_gibberish
      enabled: true
      action: drop
  min_manual_review_fraction: 0.01

# ?????? Decontamination ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
decontamination:
  jaccard_threshold:
    value: 0.80
    rationale: "Same as near-dedup: 80% overlap against test set = contamination."
    set_by: distribution_inspection
    conservative_fallback: 0.80
  exact_match: true
