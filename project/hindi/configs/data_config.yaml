# data_config.yaml ??? Hindi
# ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# All pipeline parameters for the Hindi data collection & cleaning pipeline.
# Edit this file rather than modifying script defaults.
# Every threshold must have a corresponding entry in filtering_thresholds.yaml.

lang: hindi
lang_code: hi                    # BCP-47 / ISO 639-1 code
lang_code_iso3: hin              # ISO 639-3 (used for Tesseract)
script: Devanagari

# ?????? Source targets ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Only sources that passed reconnaissance are listed here.
# Set enabled: false for sources not yet vetted or out of license scope.
sources:
  wikipedia:
    enabled: true
    hf_dataset: wikimedia/wikipedia
    hf_config: "20231101.hi"
    license: CC-BY-SA-4.0
    collection_method: downloaded
    max_docs: null               # null = all documents
    recon_sample_size: 500       # pull this many docs for inspection first

  indiccorp_v2:
    enabled: true
    hf_dataset: ai4bharat/IndicCorpV2
    hf_config: hi
    license: CC-BY-4.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 500

  oscar_2301:
    enabled: true
    hf_dataset: oscar-corpus/OSCAR-2301
    hf_config: hi
    license: CC0-1.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 500

  cc100:
    enabled: true               # enabled for bulk download
    hf_dataset: cc100
    hf_config: hi
    license: "Common Crawl ToS"
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 200

  culturax:
    enabled: true
    hf_dataset: uonlp/CulturaX
    hf_config: hi
    license: CC-BY-NC-4.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 200

# ?????? Manual collection targets ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Absolute token targets (on the FINAL cleaned/tokenized training corpus):
#   manual_target_tokens (100M) + downloaded_target_tokens (400M) = token_target (500M)
# target_manual_fraction is kept for backwards compatibility with the
# percentage-based PASS/FAIL check in manifest_utils.manual_downloaded_summary;
# it must stay consistent with manual_target_tokens / token_target below.
manual_collection:
  target_manual_fraction: 0.20        # 20% of final training tokens must be manual
  manual_target_tokens: 100_000_000   # 100M manual tokens (post-cleaning)
  downloaded_target_tokens: 400_000_000  # 400M downloaded/public tokens (post-cleaning)
  seed_url_file: hindi/data/raw/manual/scrape/seed_urls.txt
  ocr_pdf_dir:   hindi/data/raw/manual/pdf_ocr/
  transcription_dir: hindi/data/raw/manual/transcription/
  # LLM-based quality repair (see common/preprocessing/llm_quality_repair.py):
  # runs on manual documents right after ingestion, before lang_id_filter.
  llm_quality_repair:
    enabled: true
    model: 01-ai/Yi-1.5-9B-Chat     # use 01-ai/Yi-1.5-6B-Chat + use_4bit on free Colab
    use_4bit: false
    max_edit_ratio: 0.35            # above this, doc goes to needs_manual_review, not auto-kept

# ?????? Test holdout ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
test_holdout:
  fraction: 0.02                 # 2% of raw pool ??? test
  seed: 42
  stratify_by:
    - source_type
    - collection_method

# ?????? Splits (of non-test pool) ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
splits:
  train_ratio: 0.96
  val_ratio:   0.04
  seed: 42

# ?????? Token target ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
token_target: 500_000_000       # 500M tokens in final training corpus

# ?????? Miscellaneous ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
text_key: text                   # JSON key holding document text in JSONL files
batch_size: 10_000               # manifest append batch size
