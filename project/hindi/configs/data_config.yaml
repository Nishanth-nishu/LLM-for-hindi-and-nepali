# data_config.yaml ??? Hindi
# ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# All pipeline parameters for the Hindi data collection & cleaning pipeline.
# Edit this file rather than modifying script defaults.
# Every threshold must have a corresponding entry in filtering_thresholds.yaml.

lang: hindi
lang_code: hi                    # BCP-47 / ISO 639-1 code
lang_code_iso3: hin              # ISO 639-3 (used for Tesseract)
script: Devanagari

# ?????? Source targets ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Only sources that passed reconnaissance are listed here.
# Set enabled: false for sources not yet vetted or out of license scope.
sources:
  wikipedia:
    enabled: true
    hf_dataset: wikimedia/wikipedia
    hf_config: "20231101.hi"
    license: CC-BY-SA-4.0
    collection_method: downloaded
    max_docs: null               # null = all documents
    recon_sample_size: 500       # pull this many docs for inspection first

  indiccorp_v2:
    enabled: true
    hf_dataset: ai4bharat/IndicCorpV2
    hf_config: hi
    license: CC-BY-4.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 500

  oscar_2301:
    enabled: true
    hf_dataset: oscar-corpus/OSCAR-2301
    hf_config: hi
    license: CC0-1.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 500

  cc100:
    enabled: false               # disabled until recon confirms quality
    hf_dataset: cc100
    hf_config: hi
    license: "Common Crawl ToS"
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 200

# ?????? Manual collection targets ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
manual_collection:
  target_manual_fraction: 0.20   # 20% of final training tokens must be manual
  seed_url_file: hindi/data/raw/manual/scrape/seed_urls.txt
  ocr_pdf_dir:   hindi/data/raw/manual/pdf_ocr/
  transcription_dir: hindi/data/raw/manual/transcription/

# ?????? Test holdout ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
test_holdout:
  fraction: 0.02                 # 2% of raw pool ??? test
  seed: 42
  stratify_by:
    - source_type
    - collection_method

# ?????? Splits (of non-test pool) ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
splits:
  train_ratio: 0.96
  val_ratio:   0.04
  seed: 42

# ?????? Token target ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
token_target: 500_000_000       # 500M tokens in final training corpus

# ?????? Miscellaneous ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
text_key: text                   # JSON key holding document text in JSONL files
batch_size: 10_000               # manifest append batch size
