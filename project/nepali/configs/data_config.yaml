# data_config.yaml ??? Nepali
# ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# All pipeline parameters for the Nepali data collection & cleaning pipeline.
#
# Nepali-specific notes:
#  - Token target (500M) is aspirational; shortfall is expected and acceptable.
#  - Quality filters use more conservative thresholds than Hindi to preserve
#    scarce Nepali data ??? see filtering_thresholds.yaml.
#  - OCR fallback: use 'nep' Tesseract traineddata if available, else 'hin'.
#    The fallback must be flagged in the manifest and the report.
#  - Language ID: fastText lid.176.bin may mis-classify Nepali as Hindi (ne???hi
#    in Devanagari). The accepted language codes list is broadened accordingly,
#    but the threshold is set from distribution inspection (see thresholds YAML).

lang: nepali
lang_code: ne                    # BCP-47 / ISO 639-1
lang_code_iso3: nep              # ISO 639-3 (Tesseract)
lang_code_iso3_fallback: hin     # Tesseract fallback if nep traineddata absent
script: Devanagari

# ?????? Source targets ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
sources:
  wikipedia:
    enabled: true
    hf_dataset: wikimedia/wikipedia
    hf_config: "20231101.ne"
    license: CC-BY-SA-4.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 500

  indiccorp_v2:
    enabled: true
    hf_dataset: ai4bharat/IndicCorpV2
    hf_config: ne
    license: CC-BY-4.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 200       # smaller ??? corpus may be sparse

  oscar_2301:
    enabled: true
    hf_dataset: oscar-corpus/OSCAR-2301
    hf_config: ne
    license: CC0-1.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 200

  cc100:
    enabled: true
    hf_dataset: cc100
    hf_config: ne
    license: "Common Crawl ToS"
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 200

  culturax:
    enabled: false               # check availability during recon
    hf_dataset: uonlp/CulturaX
    hf_config: ne
    license: CC-BY-NC-4.0
    collection_method: downloaded
    max_docs: null
    recon_sample_size: 200

# ?????? Manual collection ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Same 100M/400M absolute split as Hindi is the TARGET, but Nepali public
# corpora are much smaller ??? if downloaded_target_tokens (400M) cannot be
# reached, do NOT pad it by inventing manual data beyond manual_target_tokens.
# Instead: keep manual_target_tokens honest, let downloaded fall short, and
# report the exact shortfall per assignment section 1.2 ("report the exact
# token count, and justify the shortfall"). The manual fraction must still be
# >= target_manual_fraction (20%) of whatever the final total ends up being.
manual_collection:
  target_manual_fraction: 0.20
  manual_target_tokens: 100_000_000
  downloaded_target_tokens: 400_000_000   # aspirational ??? see note above
  seed_url_file: nepali/data/raw/manual/scrape/seed_urls.txt
  ocr_pdf_dir:   nepali/data/raw/manual/pdf_ocr/
  transcription_dir: nepali/data/raw/manual/transcription/
  llm_quality_repair:
    enabled: true
    model: 01-ai/Yi-1.5-9B-Chat
    use_4bit: false
    max_edit_ratio: 0.35

# ?????? Test holdout ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
test_holdout:
  fraction: 0.02
  seed: 42
  stratify_by:
    - source_type
    - collection_method

# ?????? Splits ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
splits:
  train_ratio: 0.96
  val_ratio:   0.04
  seed: 42

# ?????? Token target (aspirational for low-resource language) ????????????????????????????????????????????????????????????
token_target: 500_000_000
expected_shortfall: true         # document shortfall in report if target not met

# ?????? Miscellaneous ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
text_key: text
batch_size: 10_000
