# filtering_thresholds.yaml ??? Nepali
# ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Thresholds for the Nepali cleaning pipeline.
# Values are set conservatively for this lower-resource language.
# Nepali also uses Devanagari script ??? thresholds adapted from Hindi inspection.
# Key difference: Nepali corpus is much smaller, so we set more permissive
# thresholds to maximize data retention.
#
# Distribution note: Nepali Wikipedia has 32,885 articles (vs 163K Hindi).
# We must be extra careful not to over-filter.

# ?????? Language Identification ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
language_id:
  confidence_threshold:
    value: 0.60
    rationale: "Nepali fastText confidence may be lower than Hindi because the
      model has seen less Nepali training data. 0.60 is conservative. Nepali
      articles may be classified with slightly lower confidence. Lower than
      Hindi (0.65) to preserve data."
    set_by: distribution_inspection
    conservative_fallback: 0.60

  accepted_codes:
    - ne

# ?????? Normalization / Repair ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
normalization:
  min_chars_after_norm:
    value: 50
    rationale: "Same as Hindi: minimum content threshold after normalization."
    set_by: distribution_inspection
    conservative_fallback: 50

# ?????? Quality Filters ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
quality_filters:
  min_char_count:
    value: 100
    rationale: "Nepali Wikipedia stubs are common. 100 chars drops only empty
      redirect pages. Very conservative to preserve maximum data for this
      low-resource language."
    set_by: distribution_inspection
    conservative_fallback: 100

  min_devanagari_ratio:
    value: 0.25
    rationale: "Nepali Wikipedia also mixes English technical terms. Lower than
      Hindi (0.30) because Nepali may have higher English loan word density.
      0.25 still clearly identifies Devanagari-dominant text."
    set_by: distribution_inspection
    conservative_fallback: 0.25

  max_whitespace_ratio:
    value: 0.40
    rationale: "More permissive than Hindi to preserve Nepali data.
      0.40 only drops extreme whitespace artifacts."
    set_by: distribution_inspection
    conservative_fallback: 0.40

  max_punct_symbol_ratio:
    value: 0.15
    rationale: "Using Unicode P+S category ratio. Same as Hindi ??? Nepali
      also uses dandas. 0.15 is generous."
    set_by: distribution_inspection
    conservative_fallback: 0.15

  max_digit_ratio:
    value: 0.25
    rationale: "More permissive than Hindi due to lower resource constraints."
    set_by: distribution_inspection
    conservative_fallback: 0.25

  max_url_ratio:
    value: 0.15
    rationale: "Nepali Wikipedia may have more citation-heavy stubs.
      0.15 allows reference sections while dropping URL-only pages."
    set_by: distribution_inspection
    conservative_fallback: 0.15

  max_repeated_line_ratio:
    value: 0.40
    rationale: "More permissive for Nepali to preserve data. Navbox repetition
      is acceptable at moderate levels."
    set_by: distribution_inspection
    conservative_fallback: 0.40

  max_repeated_ngram_ratio:
    value: 0.30
    rationale: "More permissive than Hindi (0.25) to preserve Nepali data."
    set_by: distribution_inspection
    conservative_fallback: 0.30

  min_mean_line_length:
    value: 8.0
    rationale: "More permissive than Hindi (10.0). Nepali has shorter words
      on average (fewer compound words than Hindi). Set at 8 chars/line."
    set_by: distribution_inspection
    conservative_fallback: 8.0

  min_paragraph_count:
    value: 1
    rationale: "Even single-paragraph stubs are valid for Nepali."
    set_by: distribution_inspection
    conservative_fallback: 1

# ?????? Exact Deduplication ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
dedup_exact:
  hash_normalisation: "whitespace_collapse_only"

# ?????? Paragraph Deduplication ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
dedup_paragraph:
  min_paragraph_frequency:
    value: 5
    rationale: "More aggressive than Hindi (threshold=10) because Nepali corpus
      is smaller and boilerplate frequency is lower. A paragraph in 5+ docs is
      likely template text."
    set_by: distribution_inspection
    conservative_fallback: 5

  min_paragraph_chars:
    value: 100
    rationale: "Same as Hindi: exclude short headings from para-dedup."
    set_by: distribution_inspection
    conservative_fallback: 100

# ?????? Near Deduplication (MinHash + LSH) ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
dedup_near:
  jaccard_threshold:
    value: 0.80
    rationale: "Standard 80% threshold. Same as Hindi."
    set_by: distribution_inspection
    conservative_fallback: 0.80

  n_gram_size: 5
  num_perm: 128

# ?????? Semantic / Safety Filter ??????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
semantic_safety:
  enabled: true
  categories:
    - name: explicit_sexual_content
      enabled: true
      action: drop
    - name: extreme_violence
      enabled: true
      action: drop
    - name: hate_speech
      enabled: true
      action: drop
    - name: spam_gibberish
      enabled: true
      action: drop
  min_manual_review_fraction: 0.01

# ?????? Decontamination ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
decontamination:
  jaccard_threshold:
    value: 0.80
    rationale: "80% overlap against test set = contamination. Standard value."
    set_by: distribution_inspection
    conservative_fallback: 0.80
  exact_match: true
