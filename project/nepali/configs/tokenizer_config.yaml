# Same structure as Hindi. Nepali-specific note:
#  - With a smaller corpus, lower vocab sizes may outperform larger ones
#    (lower fertility at smaller vocab is more likely when data is scarce).
#  - Consider sweeping an additional smaller size (e.g. 8000) if corpus < 50M tokens.

lang: nepali
model_type: unigram

train_split: nepali/data/splits/train.jsonl
text_key: text

sweep:
  vocab_sizes: [8000, 16000, 24000, 32000]   # extra 8000 for low-resource scenario
  eval_split: nepali/data/splits/val.jsonl
  metrics:
    - fertility
    - avg_chars_per_token
    - unk_rate
    - compression_ratio

final_vocab_size: null
final_vocab_size_rationale: "NOT YET SET ??? review sweep_results.csv and fill in"

sentencepiece:
  character_coverage: 0.9999
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3
  normalization_rule_name: nmt_nfkc
  remove_extra_whitespaces: true
  input_sentence_size: 2_000_000   # smaller than Hindi ??? Nepali corpus is smaller
  shuffle_input_sentence: true

output:
  vocab_dir: nepali/tokenizer/vocab/
  analysis_dir: nepali/tokenizer/analysis/
  model_name: nepali_tokenizer
