# tokenizer_config.yaml ??? Hindi (Model H, higher-resource)
# =============================================================================
# Read by train_tokenizer.py v2. Unlike v1, EVERY value here is actually used;
# nothing is hardcoded in the script.

lang: hindi
model_type: unigram            # baseline; run --compare-algorithms to justify it
text_key: text

train_split: hindi/data/splits/train.jsonl

# ?????? Vocabulary sweep ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Wider than v1's [16000, 24000, 32000]. With a monotone metric like fertility,
# a 3-point sweep whose top value is chosen tells you nothing except that you
# stopped at 32000. The ladder must be long enough for an elbow to appear
# inside it; if the selected size is the largest swept value, extend upward and
# re-run before calling it final.
sweep:
  vocab_sizes: [8000, 16000, 24000, 32000, 48000, 64000]
  eval_split: hindi/data/splits/val.jsonl

# ?????? Selection criterion ??????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# v1 used "min fertility subject to UNK < 1%", which is degenerate: fertility
# falls monotonically with vocab size, so it always returns max(vocab_sizes).
selection:
  # Stop climbing when the next rung buys less than this relative fertility
  # improvement. 2% is a defensible knee; state whatever you use in the report.
  min_relative_fertility_gain: 0.02
  # With byte_fallback the UNK rate is structurally 0, so it is a sanity check,
  # not a discriminator.
  max_unk_rate: 0.001
  # The metric that replaces UNK. Stranded single-byte pieces are what drive
  # token inflation on Devanagari.
  max_byte_fallback_rate: 0.01

# ?????? Phase 2 model, for the parameter-cost term ?????????????????????????????????????????????????????????????????????????????????????????????
# Vocabulary is not free: the embedding matrix is vocab_size x d_model. These
# numbers let the sweep report embedding share, and anchor the scaling-law
# reference point (Tao et al. 2024, N_v proportional to N_nv^0.83).
# Replace with your actual Phase 2 architecture.
# Sized for the brief's ~25M-parameter decoder-only model, NOT a 125M one.
# At this scale vocabulary is the dominant parameter decision:
#   d_model=512, 6 layers -> body ~18.9M params
#     vocab  8000 -> embeddings  4.1M  (18% of model)
#     vocab 16000 -> embeddings  8.2M  (30% of model)
#     vocab 32000 -> embeddings 16.4M  (47% of model)
# A 32k vocabulary spends nearly half the budget before a single layer exists.
# Update these three numbers to your actual Phase 2 architecture.
phase2_model:
  d_model: 512
  non_vocab_params: 15000000
  total_params: 25000000

# ?????? SentencePiece parameters ???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
sentencepiece:
  character_coverage: 0.9999
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3
  # `identity`, NOT nmt_nfkc. normalize.py already applies NFC. Two normalisers
  # in sequence means tokenizer-visible text differs from stored text, and every
  # inference path must replicate both. One normaliser, in the pipeline.
  normalization_rule_name: identity
  remove_extra_whitespaces: true
  input_sentence_size: 10000000
  shuffle_input_sentence: true
  # Eliminates UNK structurally; unseen characters become UTF-8 byte pieces.
  byte_fallback: true
  # Stops numerals consuming merge budget on a Devanagari corpus that also
  # carries ASCII digits.
  split_digits: true
  max_sentence_length: 16384

output:
  vocab_dir: hindi/tokenizer/vocab/
  analysis_dir: hindi/tokenizer/analysis/
  model_name: hindi_tokenizer      # -> hindi_tokenizer.model / .vocab / .json
