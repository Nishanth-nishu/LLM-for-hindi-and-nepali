model:
  vocab_size: 4000
  max_seq_len: 512
  d_model: 512
  n_layer: 7
  n_head: 8
  d_ff: 2048
  embed_dropout: 0.1
  attn_dropout: 0.1
  resid_dropout: 0.1
  tie_weights: true
training:
  lang: nepali
  tokenizer_model: nepali/tokenizer/vocab/nepali_tokenizer.model
  train_file: nepali/data/splits/train.jsonl
  val_file: nepali/data/splits/val.jsonl
  test_file: nepali/data/splits/test.jsonl
  batch_size: 16
  grad_accum_steps: 8
  max_steps: 6800
  warmup_steps: 300
  lr: 0.0003
  min_lr: 3.0e-05
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
  eval_every: 200
  eval_iters: 30
  ckpt_every: 500
  ckpt_dir: nepali/checkpoints
  seed: 20260820
  device: cuda
