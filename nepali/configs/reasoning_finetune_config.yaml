finetune:
  lang: nepali
  base_checkpoint: nepali/checkpoints/latest.pt   # Phase 2 authoritative Nepali checkpoint (real-data ADA GPU run, step 6800)
  tokenizer_model: nepali/tokenizer/vocab/nepali_tokenizer.model   # unchanged from pretraining -- vocab is fixed
  train_file: nepali/data/reasoning/train.jsonl
  val_file: nepali/data/reasoning/val.jsonl
  test_file: nepali/data/reasoning/test.jsonl
  delimiter: "जवाफ:"
  max_len: 128
  batch_size: 32
  epochs: 8
  lr: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  eval_every: 20
  ckpt_dir: nepali/checkpoints_reasoning
  seed: 20260909
  device: auto
